<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>寵物健康記錄器 / Pet Health Tracker</title>

<!-- PWA Web App 設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pet Tracker">
<meta name="theme-color" content="#faf9f5">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;800&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

<style>
  :root { --bg:#fff7f2; --fg:#5b4a42; --peach:#f9a98f; --cream:#fde8df; --mint:#bfe8c9; --font-display:"Huninn","Noto Sans TC",sans-serif; --font-body:"Noto Sans TC",system-ui,sans-serif; color-scheme: light; }
  html.en { --font-display:"Nunito","Noto Sans TC",sans-serif; --font-body:"Nunito","Noto Sans TC",system-ui,sans-serif; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding-inline:0; -webkit-tap-highlight-color: transparent; }
  h1,h2,h3,h4 { font-family: var(--font-display); }
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible { outline:3px solid var(--peach); outline-offset:2px; }
  [x-cloak] { display:none !important; }
  .card { background:#fff; border-radius:1.5rem; box-shadow:0 6px 20px rgba(240,160,140,.15); }
  .inp { width:100%; border:2px solid #fde2d8; background:#fffaf7; border-radius:1rem; padding:.6rem .9rem; outline:none; font-size:16px; }
  .inp:focus { border-color:#f9a98f; }
  .btn { border-radius:9999px; padding:.55rem 1.1rem; font-weight:700; transition:transform .1s; }
  .btn:active { transform:scale(.95); }
  .btn-main { background:#f9a98f; color:#fff; }
  .btn-soft { background:#fde8df; color:#c4725a; }
  .btn-green { background:#bfe8c9; color:#2f7a45; }
  .lbl { font-size:.8rem; color:#a08a80; margin-bottom:.2rem; display:block; }
  .tabbtn.active { color:#f26f4e; }
  .tabbtn.active .ico { background:#fde8df; }
</style>
</head>
<body>

<div class="min-h-screen pb-28" x-data="petApp()" x-cloak>

  <!-- 頂部標題 -->
  <header class="px-4 pt-5 pb-2 max-w-2xl mx-auto flex items-center justify-between gap-2">
    <h1 class="text-xl font-extrabold text-orange-400" x-text="'🐾 ' + t('app_title')"></h1>
    <div class="flex items-center gap-2">
      <button type="button" class="btn btn-soft !py-1.5 !px-3 text-sm" @click="setLang(lang==='zh' ? 'en' : 'zh')" x-text="lang==='zh' ? 'EN' : '中文'"></button>
      <template x-if="data.cats.length">
        <select class="inp !w-auto !py-1.5 !text-sm font-bold" x-model="data.activeId">
          <template x-for="c in data.cats" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
        </select>
      </template>
    </div>
  </header>
  <p class="px-4 max-w-2xl mx-auto text-xs" style="color:#a08a80" x-text="t('saved_note')"></p>

  <main class="px-4 max-w-2xl mx-auto space-y-4">

    <!-- 全域提醒橫幅 -->
    <template x-if="alerts.length">
      <div class="space-y-2">
        <template x-for="a in alerts" :key="a.key">
          <div class="rounded-2xl px-4 py-3 text-sm font-bold flex items-start gap-2 shadow-sm"
               :class="a.days<0 ? 'bg-red-100 text-red-700 border-2 border-red-200' : 'bg-yellow-100 text-yellow-800 border-2 border-yellow-200'">
            <span x-text="a.text"></span>
          </div>
        </template>
      </div>
    </template>

    <!-- 沒有寵物 -->
    <template x-if="!pet">
      <div class="card p-8 text-center space-y-4 mt-6">
        <div class="text-6xl">🐾</div>
        <p class="font-bold" x-text="t('no_pet')"></p>
        <div class="flex gap-2 justify-center flex-wrap">
          <button class="btn btn-main" @click="openPet()" x-text="t('add_pet')"></button>
          <button class="btn btn-soft" @click="loadDemo()" x-text="t('load_demo')"></button>
        </div>
      </div>
    </template>

    <template x-if="pet">
    <div class="space-y-4">

      <!-- ========== 1. 主頁 ========== -->
      <section x-show="tab==='home'" class="space-y-4">
        <div class="card p-5 text-center">
          <div class="w-28 h-28 rounded-full mx-auto bg-orange-100 border-4 border-orange-200 overflow-hidden flex items-center justify-center text-5xl">
            <template x-if="pet.photo"><img :src="pet.photo" class="w-full h-full object-cover"></template>
            <template x-if="!pet.photo"><span x-text="speciesIcon(pet.species)"></span></template>
          </div>
          <h2 class="mt-3 text-2xl font-extrabold" x-text="pet.name"></h2>
          <p class="text-sm text-orange-400 font-bold" x-text="age(pet.birth)"></p>
          <div class="grid grid-cols-2 gap-2 mt-4 text-left text-sm">
            <div class="bg-orange-50 rounded-2xl p-3"><span class="lbl" x-text="t('birth')"></span><b x-text="pet.birth || '—'"></b></div>
            <div class="bg-orange-50 rounded-2xl p-3"><span class="lbl" x-text="t('gender')"></span><b x-text="pet.gender ? lbl('g_', pet.gender) : '—'"></b></div>
            <div class="bg-orange-50 rounded-2xl p-3"><span class="lbl" x-text="t('species')"></span><b x-text="lbl('sp_', pet.species || 'cat')"></b></div>
            <div class="bg-orange-50 rounded-2xl p-3"><span class="lbl" x-text="t('breed')"></span><b x-text="pet.breed || '—'"></b></div>
            <div class="bg-orange-50 rounded-2xl p-3 col-span-2"><span class="lbl" x-text="t('chip')"></span><b class="break-all" x-text="pet.chip || '—'"></b></div>
          </div>
          <div class="flex gap-2 justify-center mt-4 flex-wrap">
            <button class="btn btn-soft" @click="openPet(pet)" x-text="'✏️ ' + t('edit')"></button>
            <button class="btn btn-main" @click="openPet()" x-text="t('add_pet')"></button>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="card p-4 text-center">
            <div class="text-2xl">⚖️</div><span class="lbl" x-text="t('latest_weight')"></span>
            <b class="text-lg" x-text="latestWeight ? fmtW(latestWeight.kg) : t('no_record')"></b>
            <div class="text-xs text-stone-400" x-text="latestWeight ? latestWeight.date : ''"></div>
          </div>
          <div class="card p-4 text-center">
            <div class="text-2xl">💊</div><span class="lbl" x-text="t('next_med')"></span>
            <b class="text-lg" x-text="nextMedSummary.date || t('no_record')"></b>
            <div class="text-xs text-stone-400" x-text="nextMedSummary.name"></div>
          </div>
          <div class="card p-4 text-center">
            <div class="text-2xl">💉</div><span class="lbl" x-text="t('next_vax')"></span>
            <b class="text-lg" x-text="nextVaccineSummary.date || t('no_record')"></b>
            <div class="text-xs text-stone-400" x-text="nextVaccineSummary.name"></div>
          </div>
        </div>
      </section>

      <!-- ========== 2. 體重 ========== -->
      <section x-show="tab==='weight'" class="space-y-4">
        <form class="card p-5 space-y-3" @submit.prevent="saveWeight()">
          <div class="flex items-center justify-between gap-2">
            <h3 class="font-extrabold text-lg" x-text="wForm.id ? '✏️ ' + t('w_edit') : '⚖️ ' + t('w_add')"></h3>
            <select class="inp !w-auto !py-1 !text-sm font-bold" x-model="unit" :aria-label="t('unit')">
              <option value="kg">kg</option><option value="lb">lb</option><option value="g">g</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="lbl" x-text="t('date')"></label><input type="date" class="inp" required x-model="wForm.date"></div>
            <div><label class="lbl" x-text="t('weight') + ' (' + unit + ')'"></label><input type="number" :step="unit==='g' ? '1' : '0.01'" min="0" class="inp" required x-model="wForm.kg" :placeholder="unit==='g' ? '4200' : (unit==='lb' ? '9.25' : '4.20')"></div>
          </div>
          <div><label class="lbl" x-text="t('note')"></label><input class="inp" x-model="wForm.note" :placeholder="t('ph_wnote')"></div>
          <div class="flex gap-2">
            <button class="btn btn-main flex-1" type="submit" x-text="wForm.id ? t('save_changes') : t('add')"></button>
            <button type="button" class="btn btn-soft" x-show="wForm.id" @click="resetWeight()" x-text="t('cancel')"></button>
          </div>
        </form>

        <div class="card p-4">
          <h3 class="font-extrabold mb-2" x-text="'📈 ' + t('trend')"></h3>
          <div class="relative h-60"><canvas id="weightChart"></canvas></div>
          <p class="text-center text-stone-400 text-sm mt-2" x-show="pet.weights.length<1" x-text="t('trend_empty')"></p>
        </div>

        <div class="card p-4">
          <h3 class="font-extrabold mb-2" x-text="'📋 ' + t('history')"></h3>
          <template x-for="w in [...pet.weights].sort((a,b)=>b.date.localeCompare(a.date))" :key="w.id">
            <div class="flex items-center justify-between py-2 border-b border-orange-50 last:border-0">
              <div>
                <b x-text="fmtW(w.kg)"></b>
                <span class="text-xs text-stone-400 ml-2" x-text="w.date"></span>
                <div class="text-xs text-stone-500" x-text="w.note"></div>
              </div>
              <div class="flex gap-1">
                <button class="btn btn-soft !px-3 !py-1 text-sm" @click="editWeight(w)" x-text="t('edit')"></button>
                <button class="btn btn-soft !px-3 !py-1 text-sm" @click="delWeight(w.id)" x-text="t('delete')"></button>
              </div>
            </div>
          </template>
          <p class="text-center text-stone-400 py-3" x-show="!pet.weights.length" x-text="t('no_weights')"></p>
        </div>
      </section>

      <!-- ========== 3. 醫療（子分頁） ========== -->
      <section x-show="tab==='medical'" class="space-y-4">

        <div class="flex gap-2 overflow-x-auto pb-1">
          <template x-for="s in msubs" :key="s.id">
            <button type="button" class="btn whitespace-nowrap text-sm" :class="msub===s.id ? 'btn-main' : 'btn-soft'" @click="msub=s.id" x-text="s.icon + ' ' + t('sub_' + s.id)"></button>
          </template>
        </div>

        <!-- ---- 3a. 驅蟲提醒 ---- -->
        <div x-show="msub==='care'" class="space-y-4">
          <form class="card p-5 space-y-3" @submit.prevent="saveMed()">
            <h3 class="font-extrabold text-lg" x-text="mForm.id ? '✏️ ' + t('med_edit_title') : '🛡️ ' + t('med_add_title')"></h3>
            <div>
              <label class="lbl" x-text="t('med_type')"></label>
              <select class="inp" x-model="mForm.type">
                <template x-for="mt in medTypesFor" :key="mt"><option :value="mt" x-text="lbl('mt_', mt)"></option></template>
              </select>
            </div>
            <div>
              <label class="lbl" x-text="t('med_name')"></label>
              <input class="inp" required x-model="mForm.name" :placeholder="t('ph_med')">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="lbl" x-text="t('cycle')"></label>
                <select class="inp" x-model="mForm.cycle">
                  <template x-for="n in [30,60,90,180,365]" :key="n"><option :value="String(n)" x-text="t('every_n',{n:n})"></option></template>
                  <option value="custom" x-text="t('custom_days')"></option>
                </select>
              </div>
              <div>
                <label class="lbl" x-text="t('last_dose')"></label>
                <input type="date" class="inp" required x-model="mForm.last">
              </div>
            </div>
            <div x-show="mForm.cycle==='custom'">
              <label class="lbl" x-text="t('custom_cycle')"></label>
              <input type="number" min="1" class="inp" x-model="mForm.custom" :placeholder="t('ph_custom')">
            </div>
            <div class="flex gap-2">
              <button class="btn btn-main flex-1" type="submit" x-text="mForm.id ? t('save_changes') : t('add')"></button>
              <button type="button" class="btn btn-soft" x-show="mForm.id" @click="resetMed()" x-text="t('cancel')"></button>
            </div>
          </form>

          <template x-if="!pet.meds.length"><p class="text-center text-stone-400 py-4" x-text="t('no_meds')"></p></template>
          <template x-for="m in sortedMeds" :key="m.id">
            <div class="card p-4 space-y-3" :class="statusOf(m).key==='red' ? 'ring-2 ring-red-200' : ''">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <span class="text-xs bg-orange-100 text-orange-500 rounded-full px-2 py-0.5 font-bold" x-text="lbl('mt_', m.type)"></span>
                  <h4 class="font-extrabold text-lg mt-1" x-text="m.name"></h4>
                </div>
                <span class="text-xs font-bold rounded-full px-3 py-1 whitespace-nowrap" :class="statusOf(m).cls" x-text="statusOf(m).label"></span>
              </div>
              <div class="grid grid-cols-3 gap-2 text-sm text-center">
                <div class="bg-orange-50 rounded-xl p-2"><span class="lbl" x-text="t('cycle_short')"></span><b x-text="t('every_n',{n:m.cycle})"></b></div>
                <div class="bg-orange-50 rounded-xl p-2"><span class="lbl" x-text="t('last')"></span><b x-text="m.last"></b></div>
                <div class="bg-orange-50 rounded-xl p-2"><span class="lbl" x-text="t('next')"></span><b x-text="nextDate(m)"></b></div>
              </div>
              <div class="text-sm text-stone-500" x-text="statusOf(m).detail"></div>
              <div class="flex gap-2 flex-wrap">
                <button class="btn btn-green" @click="markFed(m)" x-text="t('fed_today')"></button>
                <button class="btn btn-soft" @click="editMed(m)" x-text="t('edit')"></button>
                <button class="btn btn-soft" @click="delMed(m.id)" x-text="t('delete')"></button>
              </div>
            </div>
          </template>
        </div>

        <!-- ---- 3b. 用藥紀錄（處方／保健品） ---- -->
        <div x-show="msub==='rx'" class="space-y-4">
          <form class="card p-5 space-y-3" @submit.prevent="saveRx()">
            <h3 class="font-extrabold text-lg" x-text="rxForm.id ? '✏️ ' + t('rx_edit_title') : '💊 ' + t('rx_add_title')"></h3>
            <div>
              <label class="lbl" x-text="t('rx_name')"></label>
              <input class="inp" required x-model="rxForm.name" :placeholder="t('ph_rxname')">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="lbl" x-text="t('rx_kind')"></label>
                <select class="inp" x-model="rxForm.kind">
                  <option value="rx" x-text="t('k_rx')"></option>
                  <option value="supp" x-text="t('k_supp')"></option>
                </select>
              </div>
              <div>
                <label class="lbl" x-text="t('rx_start')"></label>
                <input type="date" class="inp" required x-model="rxForm.start">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="lbl" x-text="t('rx_dose')"></label><input class="inp" x-model="rxForm.dose" :placeholder="t('ph_dose')"></div>
              <div><label class="lbl" x-text="t('rx_freq')"></label><input class="inp" x-model="rxForm.freq" :placeholder="t('ph_freq')"></div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="lbl" x-text="t('rx_days')"></label><input type="number" min="1" inputmode="numeric" class="inp" x-model="rxForm.days" :placeholder="t('ph_days')"></div>
              <div><label class="lbl" x-text="t('rx_doctor')"></label><input class="inp" x-model="rxForm.doctor" :placeholder="t('ph_rxdoc')"></div>
            </div>
            <div><label class="lbl" x-text="t('rx_reason')"></label><input class="inp" x-model="rxForm.reason" :placeholder="t('ph_reason')"></div>
            <div><label class="lbl" x-text="t('note')"></label><textarea rows="2" class="inp" x-model="rxForm.note"></textarea></div>

            <div x-show="hasDays(rxForm.days)" class="bg-orange-50 rounded-2xl p-3 space-y-2">
              <label class="flex items-center gap-2 text-sm font-bold">
                <input type="checkbox" class="w-5 h-5" x-model="rxForm.remind">
                <span x-text="t('rx_remind')"></span>
              </label>
              <div x-show="rxForm.remind" class="flex items-center gap-2 text-sm">
                <span x-text="t('rx_remind_days')"></span>
                <input type="number" min="0" inputmode="numeric" class="inp !w-20 !py-1" x-model="rxForm.remindDays">
                <span x-text="t('days_unit')"></span>
              </div>
            </div>

            <div>
              <label class="lbl" x-text="t('photos')"></label>
              <div class="flex flex-wrap gap-2 mb-2">
                <template x-for="f in rxForm.files" :key="f.id">
                  <div class="relative w-16 h-16 rounded-xl overflow-hidden bg-orange-50 border border-orange-100 flex items-center justify-center">
                    <template x-if="src(f.id)"><img :src="src(f.id)" class="w-full h-full object-cover"></template>
                    <template x-if="!src(f.id)"><span>📷</span></template>
                    <button type="button" class="absolute top-0 right-0 bg-black/50 text-white text-xs w-5 h-5 rounded-bl-lg" @click="removeFile(rxForm, f)">✕</button>
                  </div>
                </template>
              </div>
              <input type="file" accept="image/*" multiple class="text-sm" @change="addFiles(rxForm, $event, false)">
              <p class="text-xs text-stone-400 mt-1" x-text="t('hint_photos')"></p>
            </div>

            <div class="flex gap-2">
              <button class="btn btn-main flex-1" type="submit" x-text="rxForm.id ? t('save_changes') : t('add')"></button>
              <button type="button" class="btn btn-soft" x-show="rxForm.id" @click="cancelRx()" x-text="t('cancel')"></button>
            </div>
          </form>

          <p class="text-center text-stone-400 py-4" x-show="!pet.rx.length" x-text="t('no_rx')"></p>

          <h3 class="font-extrabold px-1" x-show="rxActive.length" x-text="'🟢 ' + t('rx_active')"></h3>
          <template x-for="r in rxActive" :key="r.id">
            <div class="card p-4 space-y-3">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <span class="text-xs rounded-full px-2 py-0.5 font-bold" :class="r.kind==='supp' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-500'" x-text="lbl('k_', r.kind)"></span>
                  <h4 class="font-extrabold text-lg mt-1" x-text="r.name"></h4>
                </div>
                <span class="text-xs font-bold rounded-full px-3 py-1 whitespace-nowrap" :class="rxStatus(r).cls" x-text="rxStatus(r).label"></span>
              </div>
              <div class="grid grid-cols-2 gap-2 text-sm">
                <div class="bg-orange-50 rounded-xl p-2" x-show="r.dose"><span class="lbl" x-text="t('rx_dose')"></span><b x-text="r.dose"></b></div>
                <div class="bg-orange-50 rounded-xl p-2" x-show="r.freq"><span class="lbl" x-text="t('rx_freq')"></span><b x-text="r.freq"></b></div>
                <div class="bg-orange-50 rounded-xl p-2"><span class="lbl" x-text="t('rx_start')"></span><b x-text="r.start"></b></div>
                <div class="bg-orange-50 rounded-xl p-2" x-show="rxLast(r)"><span class="lbl" x-text="t('rx_last')"></span><b x-text="rxLast(r)"></b></div>
              </div>
              <div class="text-sm text-stone-500" x-show="rxStatus(r).detail" x-text="rxStatus(r).detail"></div>
              <p class="text-sm" x-show="r.reason" x-text="t('rx_reason_l') + r.reason"></p>
              <p class="text-sm" x-show="r.doctor" x-text="t('rx_doctor_l') + r.doctor"></p>
              <p class="text-sm text-stone-500 whitespace-pre-wrap" x-show="r.note" x-text="r.note"></p>

              <div class="flex flex-wrap gap-2" x-show="(r.files||[]).length">
                <template x-for="f in (r.files||[])" :key="f.id">
                  <button type="button" class="w-16 h-16 rounded-xl overflow-hidden bg-orange-50 border border-orange-100 flex items-center justify-center text-xs font-bold text-orange-500" @click="openFile(f)">
                    <template x-if="src(f.id)"><img :src="src(f.id)" class="w-full h-full object-cover"></template>
                    <template x-if="!src(f.id)"><span>📷</span></template>
                  </button>
                </template>
              </div>

              <div class="flex gap-2 flex-wrap">
                <button type="button" class="btn btn-green" x-show="r.days" @click="r.remind = !r.remind" x-text="r.remind ? t('rx_remind_on') : t('rx_remind_off')"></button>
                <button type="button" class="btn btn-soft" @click="editRx(r)" x-text="t('edit')"></button>
                <button type="button" class="btn btn-soft" @click="delRx(r.id)" x-text="t('delete')"></button>
              </div>
            </div>
          </template>

          <h3 class="font-extrabold px-1" x-show="rxEnded.length" x-text="'⚪ ' + t('rx_ended')"></h3>
          <template x-for="r in rxEnded" :key="r.id">
            <div class="card p-4 space-y-3 opacity-90">
              <div class="flex items-start justify-between gap-2">
                <div>
                  <span class="text-xs rounded-full px-2 py-0.5 font-bold" :class="r.kind==='supp' ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-500'" x-text="lbl('k_', r.kind)"></span>
                  <h4 class="font-extrabold text-lg mt-1" x-text="r.name"></h4>
                </div>

            <div class="flex gap-2">

              <div class="flex items-start justify-between gap-2">

              </div>
              <div x-show="r.summary">

                <p class="text-sm whitespace-pre-wrap" x-text="r.summary"></p>

              <div x-show="r.opinion">

                <p class="text-sm whitespace-pre-wrap" x-text="r.opinion"></p>
              </div>

              <div class="flex flex-wrap gap-2" x-show="(r.files||[]).length">
                <template x-for="f in (r.files||[])" :key="f.id">
                  <button type="button" class="w-16 h-16 rounded-xl overflow-hidden bg-orange-50 border border-orange-100 flex items-center justify-center text-xs font-bold text-orange-500" @click="openFile(f)">

                    <template x-if="f.type!=='application/pdf' && src(f.id)"><img :src="src(f.id)" class="w-full h-full object-cover"></template>

                  </button>

              <div class="flex gap-2">
                <button type="button" class="btn btn-soft" @click="editReport(r)" x-text="t('edit')"></button>
                <button type="button" class="btn btn-soft" @click="delReport(r.id)" x-text="t('delete')"></button>
              </div>
            </div>
          </template>
        </div>

        <!-- ---- 3d. 疫苗 ---- -->

              <div><label class="lbl" x-text="t('vax_next')"></label><input type="date" class="inp" x-model="vForm.next"></div>
            </div>
            <button class="btn btn-main w-full" type="submit" x-text="t('add_vax')"></button>
          </form>

          <template x-for="v in [...pet.vaccines].sort((a,b)=>b.date.localeCompare(a.date))" :key="v.id">

            </div>
          </template>

              <div><label class="lbl" x-text="t('date')"></label><input type="date" class="inp" required x-model="eForm.date"></div>

                <label class="lbl" x-text="t('type')"></label>
                <select class="inp" x-model="eForm.type">

                </select>
              </div>

            <button class="btn btn-main w-full" type="submit" x-text="t('add_ev')"></button>

                <div class="flex items-center gap-2"><span class="text-xl" x-text="eventIcon(e.type)"></span><b x-text="lbl('et_', e.type)"></b></div>

              <button class="btn btn-soft !px-3 !py-1 text-sm" @click="delEvent(e.id)" x-text="t('delete')"></button>

          </template>
          <p class="text-center text-stone-400 py-2" x-show="!pet.events.length" x-text="t('no_events')"></p>
        </div>
      </section>

      <!-- ========== 4. 生活 ========== -->

            <div><label class="lbl" x-text="t('date')"></label><input type="date" class="inp" required x-model="lForm.date"></div>

              <label class="lbl" x-text="t('category')"></label>
              <select class="inp" x-model="lForm.type">
                <template x-for="lt in lifeTypes" :key="lt"><option :value="lt" x-text="lbl('lt_', lt)"></option></template>
              </select>
            </div>

                  <template x-if="src(f.id)"><img :src="src(f.id)" class="w-full h-full object-cover"></template>
                  <template x-if="!src(f.id)"><span>📷</span></template>
                  <button type="button" class="absolute top-0 right-0 bg-black/50 text-white text-xs w-5 h-5 rounded-bl-lg" @click="removeFile(lForm, f)">✕</button>
                </div>
              </template>
            </div>
            <input type="file" accept="image/*" multiple class="text-sm" @change="addFiles(lForm, $event, false)">

                  <template x-if="src(f.id)"><img :src="src(f.id)" class="w-full h-full object-cover"></template>
                  <template x-if="!src(f.id)"><span>📷</span></template>

              </template>
            </div>
          </div>

        <p class="text-center text-stone-400 py-2" x-show="!pet.lifeLogs.length" x-text="t('no_life')"></p>

            <div><label class="lbl" x-text="t('phone_lbl')"></label><input type="tel" class="inp" x-model="vetForm.phone" :placeholder="t('optional')"></div>

          <div><label class="lbl" x-text="t('addr_note')"></label><input class="inp" x-model="vetForm.note" :placeholder="t('ph_note')"></div>
          <button class="btn btn-main w-full" type="submit" x-text="t('add_clinic')"></button>
        </form>

        <template x-for="v in pet.vets" :key="v.id">
          <div class="card p-4 flex items-start justify-between gap-2 border-l-4 border-orange-300">

              <div class="text-xs text-stone-400 mt-1" x-show="v.note" x-text="'📍 ' + v.note"></div>

            <button class="btn btn-soft !px-3 !py-1 text-sm" @click="delVet(v.id)" x-text="t('delete')"></button>

        <p class="text-center text-stone-400 py-2" x-show="!pet.vets.length" x-text="t('no_clinics')"></p>

          <h3 class="font-extrabold text-lg" x-text="'📦 ' + t('full_title')"></h3>

              <span x-text="t('import_full')"></span>
              <input type="file" accept=".json,application/json" class="hidden" @change="importFull($event)">
            </label>
          </div>
        </div>

        <div class="card p-5 space-y-3">

            <button type="button" class="btn btn-soft" @click="restoreBackup()" x-text="t('restore_backup')"></button>
          </div>

    </div>

/* ---------- IndexedDB（相片／PDF 儲存） ---------- */
const DB_NAME = 'petTrackerFiles', STORE = 'files';
let dbPromise = null;
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE, { keyPath: 'id' });
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbPromise;
}
async function idbPut(rec) {
  const db = await openDB();
  return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).put(rec); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
}
async function idbGet(id) {
  const db = await openDB();
  return new Promise((res, rej) => { const q = db.transaction(STORE).objectStore(STORE).get(id); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function idbDel(id) {
  const db = await openDB();
  return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).delete(id); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
}
async function idbAll() {
  const db = await openDB();
  return new Promise((res, rej) => { const q = db.transaction(STORE).objectStore(STORE).getAll(); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
}
async function idbClear() {
  const db = await openDB();
  return new Promise((res, rej) => { const tx = db.transaction(STORE, 'readwrite'); tx.objectStore(STORE).clear(); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); });
}

/* ---------- 檔案工具 ---------- */
function readAsDataURL(file) {
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
}
function compressImage(file, max = 1200, q = 0.8) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = () => rej(r.error);
    r.onload = e => {
      const img = new Image();
      img.onerror = () => rej(new Error('img'));
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.round(img.width * s), h = Math.round(img.height * s);
        const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', q));
      };
      img.src = e.target.result;
    };
    r.readAsDataURL(file);
  });
}
function dataUrlToBlob(u) {
  const parts = u.split(','), mime = (parts[0].match(/:(.*?);/) || [])[1] || 'application/octet-stream';
  const bin = atob(parts[1]), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

const emptyFiles = () => ({ files: [], added: [], removed: [] });

function petApp() {
  return {
    data: { cats: [], activeId: null },   // data.cats 名稱維持不變，確保舊資料相容
    tab: 'home',
    msub: 'care',
    lang: 'zh',
    unit: 'kg',
    tabs: [
      { id: 'home', icon: '🐾' },
      { id: 'weight', icon: '⚖️' },
      { id: 'medical', icon: '🏥' },
      { id: 'life', icon: '📘' },
      { id: 'more', icon: '⚙️' },
    ],
    msubs: [
      { id: 'care', icon: '🛡️' },
      { id: 'rx', icon: '💊' },
      { id: 'reports', icon: '🔬' },
      { id: 'vaccine', icon: '💉' },
      { id: 'events', icon: '📝' },
    ],
    speciesList: ['cat', 'dog', 'rabbit', 'other'],
    genderList: ['', 'male', 'female', 'male_n', 'female_n'],
    eventTypes: ['vomit', 'diarrhea', 'appetite', 'lethargy', 'cough', 'other'],
    lifeTypes: ['diet', 'behavior', 'mood', 'env', 'other'],
    reportTypes: ['blood', 'xray', 'ultrasound', 'urine', 'other'],

    petModal: false, clinicEdit: false,
    cForm: {}, mForm: {}, wForm: {}, vForm: {}, eForm: {}, vetForm: {},
    lForm: { ...emptyFiles() }, rxForm: { ...emptyFiles() }, rpForm: { ...emptyFiles() },
    fileCache: {}, lightbox: null,
    confirmBox: null, toastMsg: '', toastTimer: null, backupText: '',

    // ---------- 語言 / 單位 ----------
    t(k, v) {
      let s = (I18N[this.lang] && I18N[this.lang][k]) || I18N.zh[k] || k;
      if (v) for (const x in v) s = s.split('{' + x + '}').join(v[x]);
      return s;
    },
    lbl(prefix, code) {
      const s = (I18N[this.lang] || {})[prefix + code];
      return s || code;
    },
    setLang(l) {
      this.lang = l;
      try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
      this.applyLang();
      setTimeout(() => this.drawChart(), 50);
    },
    applyLang() {
      document.documentElement.lang = this.lang === 'zh' ? 'zh-Hant' : 'en';
      document.documentElement.classList.toggle('en', this.lang === 'en');
      document.title = this.t('app_title');
    },
    speciesIcon(sp) { return { cat: '🐱', dog: '🐶', rabbit: '🐰' }[sp] || '🐾'; },
    reportIcon(t) { return { blood: '🩸', xray: '🦴', ultrasound: '🔍', urine: '🧪' }[t] || '📄'; },

    fromKg(kg) {
      kg = Number(kg);
      if (this.unit === 'g') return Math.round(kg * 1000);
      if (this.unit === 'lb') return Math.round(kg * 2.20462 * 100) / 100;
      return Math.round(kg * 100) / 100;
    },
    toKg(v) {
      v = Number(v);
      let kg = v;
      if (this.unit === 'g') kg = v / 1000;
      else if (this.unit === 'lb') kg = v / 2.20462;
      return Math.round(kg * 10000) / 10000;
    },
    fmtW(kg) { return this.fromKg(kg) + ' ' + this.unit; },

    // ---------- 檔案（相片／PDF） ----------
    src(id) {
      if (this.fileCache[id] !== undefined) return this.fileCache[id];
      if (!requested.has(id)) {
        requested.add(id);
        idbGet(id).then(r => {
          this.fileCache = { ...this.fileCache, [id]: (r && r.type !== 'application/pdf') ? r.data : '' };
        }).catch(() => { this.fileCache = { ...this.fileCache, [id]: '' }; });
      }
      return '';
    },
    async openFile(f) {
      if (f.type === 'application/pdf') {
        const w = window.open('', '_blank');
        try {
          const r = await idbGet(f.id);
          if (!r) { if (w) w.close(); return this.say(this.t('t_missing')); }
          const url = URL.createObjectURL(dataUrlToBlob(r.data));
          if (w) { w.location.href = url; }
          else { const a = document.createElement('a'); a.href = url; a.download = f.name || 'file.pdf'; document.body.appendChild(a); a.click(); a.remove(); }
          setTimeout(() => URL.revokeObjectURL(url), 60000);
        } catch (e) { if (w) w.close(); this.say(this.t('t_filefail')); }
      } else if (this.src(f.id)) {
        this.lightbox = f.id;
      } else {
        this.say(this.t('t_missing'));
      }
    },
    async addFiles(form, ev, allowPdf) {
      const list = [...ev.target.files]; ev.target.value = '';
      for (const f of list) {
        if (form.files.length >= MAX_FILES) { this.say(this.t('t_maxfiles', { n: MAX_FILES })); break; }
        try {
          let rec;
          if (f.type === 'application/pdf' || /\.pdf$/i.test(f.name)) {
            if (!allowPdf) { this.say(this.t('t_imgonly')); continue; }
            if (f.size > MAX_PDF) { this.say(this.t('t_toobig')); continue; }
            rec = { id: uid(), name: f.name, type: 'application/pdf', data: await readAsDataURL(f) };
          } else if (f.type.startsWith('image/')) {
            rec = { id: uid(), name: f.name, type: 'image/jpeg', data: await compressImage(f) };
          } else { this.say(this.t('t_badtype')); continue; }
          await idbPut(rec);
          if (rec.type !== 'application/pdf') this.fileCache = { ...this.fileCache, [rec.id]: rec.data };
          form.files.push({ id: rec.id, name: rec.name, type: rec.type });
          form.added.push(rec.id);
        } catch (e) { this.say(this.t('t_filefail')); }
      }
    },
    removeFile(form, f) {
      form.files = form.files.filter(x => x.id !== f.id);
      const i = form.added.indexOf(f.id);
      if (i >= 0) { form.added.splice(i, 1); this.removeFiles([{ id: f.id }]); }
      else form.removed.push(f.id);
    },
    async removeFiles(list) {
      const ids = (list || []).map(f => f.id);
      for (const id of ids) { try { await idbDel(id); } catch (e) {} requested.delete(id); }
      if (ids.length) { const c = { ...this.fileCache }; ids.forEach(id => delete c[id]); this.fileCache = c; }
    },
    async commitForm(form) {
      const ids = (form.removed || []).map(id => ({ id }));
      form.removed = []; form.added = [];
      await this.removeFiles(ids);
    },
    async discardForm(form) {
      const ids = (form.added || []).map(id => ({ id }));
      form.added = []; form.removed = [];
      await this.removeFiles(ids);
    },
    async discardAll() {
      await Promise.all([this.discardForm(this.lForm), this.discardForm(this.rxForm), this.discardForm(this.rpForm)]);
      this.resetLife(); this.resetRx(); this.resetReport();
    },
    plainFiles(arr) { return (arr || []).map(x => ({ id: x.id, name: x.name, type: x.type })); },

    // ---------- 備份 ----------
    copyBackup() {
      this.backupText = JSON.stringify(this.data);
      const sel = () => this.$nextTick(() => { const b = document.getElementById('backupBox'); if (b) { b.focus(); b.select(); } });
      try {
        navigator.clipboard.writeText(this.backupText).then(() => this.say(this.t('t_copied')), () => { sel(); this.say(this.t('t_manual')); });
      } catch (e) { sel(); this.say(this.t('t_manual')); }
    },
    restoreBackup() {
      let d;
      try { d = JSON.parse(this.backupText.trim()); } catch (e) { return this.say(this.t('t_badfmt')); }
      if (!d || !Array.isArray(d.cats)) return this.say(this.t('t_invalid'));
      this.ask(this.t('c_restore'), () => {
        if (!d.cats.find(c => c.id === d.activeId)) d.activeId = d.cats.length ? d.cats[0].id : null;
        try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { return this.say(this.t('t_restfail')); }
        this.say(this.t('t_restored', { n: d.cats.length }));
        setTimeout(() => window.location.reload(), 300);
      });
    },
    async exportFull() {
      try {
        const all = await idbAll(), files = {};
        all.forEach(r => { files[r.id] = { name: r.name, type: r.type, data: r.data }; });
        const json = JSON.stringify({ app: 'pet-health-tracker', version: 2, data: this.data, files });
        const name = 'pet-backup-' + this.today() + '.json';
        const file = new File([json], name, { type: 'application/json' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file], title: name }); this.say(this.t('t_exported')); return; }
          catch (e) { if (e && e.name === 'AbortError') return; }
        }
        const url = URL.createObjectURL(file);
        const a = document.createElement('a'); a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        this.say(this.t('t_exported'));
      } catch (e) { this.say(this.t('t_exportfail')); }
    },
    importFull(ev) {
      const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        let p; try { p = JSON.parse(r.result); } catch (e) { return this.say(this.t('t_importfail')); }
        const d = (p && p.data && Array.isArray(p.data.cats)) ? p.data : ((p && Array.isArray(p.cats)) ? p : null);
        if (!d) return this.say(this.t('t_importfail'));
        const files = (p.data && p.files) ? p.files : null;
        this.ask(this.t('c_import'), async () => {
          try {
            if (files) {
              await idbClear();
              for (const id in files) { const x = files[id]; await idbPut({ id, name: x.name, type: x.type, data: x.data }); }
            }
            if (!d.cats.find(c => c.id === d.activeId)) d.activeId = d.cats.length ? d.cats[0].id : null;
            localStorage.setItem(KEY, JSON.stringify(d));
            this.say(this.t('t_imported', { n: d.cats.length }));
            setTimeout(() => window.location.reload(), 400);
          } catch (e) { this.say(this.t('t_restfail')); }
        });
      };
      r.readAsText(f);
    },
    ask(msg, fn) { this.confirmBox = { msg, fn }; },
    yes() { const b = this.confirmBox; this.confirmBox = null; if (b && b.fn) b.fn(); },
    say(msg) { this.toastMsg = msg; clearTimeout(this.toastTimer); this.toastTimer = setTimeout(() => this.toastMsg = '', 2800); },

    // ---------- 初始化 ----------
    init() {
      let hadData = false;
      try {
        const s = JSON.parse(localStorage.getItem(KEY));
        if (s && s.cats) {
          hadData = s.cats.length > 0;
          // 自動升級舊資料：補欄位 + 中文值轉代碼
          s.cats.forEach(c => {
            if (!c.species) c.species = 'cat';
            if (!c.lifeLogs) c.lifeLogs = [];
            if (!c.vets) c.vets = [];
            if (!c.clinic) c.clinic = { name: '', vet: '', phone: '', address: '' };
            if (!c.meds) c.meds = [];
            if (!c.weights) c.weights = [];
            if (!c.vaccines) c.vaccines = [];
            if (!c.events) c.events = [];
            if (!c.rx) c.rx = [];
            if (!c.reports) c.reports = [];
            c.gender = norm(c.gender || '');
            c.meds.forEach(m => { m.type = norm(m.type); });
            c.events.forEach(e => { e.type = norm(e.type); });
            c.lifeLogs.forEach(l => { l.type = norm(l.type); if (!l.files) l.files = []; });
            c.rx.forEach(r => { if (!r.files) r.files = []; });
            c.reports.forEach(r => { if (!r.files) r.files = []; });
          });
          this.data = s;
        }
      } catch (e) {}

      // 要求瀏覽器盡量保留資料（避免被自動清走）
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}

      // 語言：已儲存 > 舊用戶預設中文 > 按瀏覽器語言
      let l = null, u = null;
      try { l = localStorage.getItem(LANG_KEY); u = localStorage.getItem(UNIT_KEY); } catch (e) {}
      this.lang = (l === 'zh' || l === 'en') ? l : (hadData ? 'zh' : ((navigator.language || '').toLowerCase().startsWith('zh') ? 'zh' : 'en'));
      this.unit = ['kg', 'lb', 'g'].includes(u) ? u : 'kg';
      this.applyLang();

      if (this.data.cats.length && !this.data.cats.find(c => c.id === this.data.activeId)) this.data.activeId = this.data.cats[0].id;
      this.resetMed(); this.resetWeight(); this.resetVaccine(); this.resetEvent();
      this.resetLife(); this.resetVet(); this.resetRx(); this.resetReport();

      this.$watch('data', () => {
        try { localStorage.setItem(KEY, JSON.stringify(this.data)); } catch (e) { this.say(this.t('t_quota')); }
        this.$nextTick(() => this.drawChart());
      }, { deep: true });
      this.$watch('tab', () => setTimeout(() => this.drawChart(), 50));
      this.$watch('unit', () => {
        try { localStorage.setItem(UNIT_KEY, this.unit); } catch (e) {}
        this.resetWeight();
        setTimeout(() => this.drawChart(), 50);
      });
      this.$watch('data.activeId', () => {
        this.clinicEdit = false; this.resetMed(); this.resetWeight(); this.resetVaccine();
        this.discardAll();
        setTimeout(() => this.drawChart(), 50);
      });
    },

    // ---------- 日期工具 ----------
    today() { const d = new Date(); return this.iso(d); },
    iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); },
    parse(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); },
    addDays(s, n) { const d = this.parse(s); d.setDate(d.getDate() + Number(n)); return this.iso(d); },
    diffDays(s) { return Math.round((this.parse(s) - this.parse(this.today())) / 86400000); },
    age(b) {
      if (!b) return '';
      const bd = this.parse(b), n = new Date();
      let m = (n.getFullYear() - bd.getFullYear()) * 12 + n.getMonth() - bd.getMonth();
      if (n.getDate() < bd.getDate()) m--;
      if (m < 0) return '';
      const y = Math.floor(m / 12), r = m % 12;
      if (this.lang === 'zh') return y ? `${y} 歲${r ? ' ' + r + ' 個月' : ''}` : `${r} 個月大`;
      return y ? `${y} yr${y > 1 ? 's' : ''}${r ? ' ' + r + ' mo' : ''}` : `${r} mo old`;
    },

    // ---------- 計算屬性 ----------
    get pet() { return this.data.cats.find(c => c.id === this.data.activeId) || null; },
    get medTypesFor() {
      const sp = this.pet ? this.pet.species : 'cat';
      return (sp === 'cat' || sp === 'dog') ? ['flea', 'heartworm', 'dewormer', 'chronic'] : ['flea', 'dewormer', 'chronic'];
    },
    get vaccSuggest() {
      const sp = this.pet ? this.pet.species : 'cat';
      return (VACC[sp] || VACC.other)[this.lang];
    },
    get latestWeight() {
      if (!this.pet || !this.pet.weights.length) return null;
      return [...this.pet.weights].sort((a, b) => b.date.localeCompare(a.date))[0];
    },
    get sortedMeds() { return [...this.pet.meds].sort((a, b) => this.nextDate(a).localeCompare(this.nextDate(b))); },
    get nextMedSummary() {
      if (!this.pet || !this.pet.meds.length) return {};
      const m = this.sortedMeds[0];
      return { date: this.nextDate(m), name: m.name };
    },
    get nextVaccineSummary() {
      if (!this.pet) return {};
      const l = this.pet.vaccines.filter(v => v.next).sort((a, b) => a.next.localeCompare(b.next));
      const upcoming = l.find(v => this.diffDays(v.next) >= 0) || l[0];
      return upcoming ? { date: upcoming.next, name: upcoming.name } : {};
    },
    get rxActive() {
      if (!this.pet) return [];
      return this.pet.rx.filter(r => !this.rxStatus(r).ended)
        .sort((a, b) => (this.rxLast(a) || '9999-99-99').localeCompare(this.rxLast(b) || '9999-99-99'));
    },
    get rxEnded() {
      if (!this.pet) return [];
      return this.pet.rx.filter(r => this.rxStatus(r).ended).sort((a, b) => this.rxLast(b).localeCompare(this.rxLast(a)));
    },
    get reportsSorted() {
      if (!this.pet) return [];
      return [...this.pet.reports].sort((a, b) => b.date.localeCompare(a.date));
    },
    get alerts() {
      const out = [];
      for (const c of this.data.cats) {
        for (const m of c.meds) {
          const d = this.diffDays(this.nextDate(m));
          const p = { pet: c.name, name: m.name, n: Math.abs(d) };
          if (d < 0) out.push({ key: 'm' + m.id, days: d, text: this.t('al_med_over', p) });
          else if (d <= 7) out.push({ key: 'm' + m.id, days: d, text: this.t(d === 0 ? 'al_med_today' : 'al_med_soon', p) });
        }
        for (const v of c.vaccines) {
          if (!v.next) continue;
          const d = this.diffDays(v.next);
          const p = { pet: c.name, name: v.name, n: Math.abs(d) };
          if (d < 0) out.push({ key: 'v' + v.id, days: d, text: this.t('al_vax_over', p) });
          else if (d <= 7) out.push({ key: 'v' + v.id, days: d, text: this.t(d === 0 ? 'al_vax_today' : 'al_vax_soon', p) });
        }
        for (const r of (c.rx || [])) {
          if (!r.remind || !r.days) continue;
          const d = this.diffDays(this.rxLast(r));
          const lim = (r.remindDays === undefined || r.remindDays === null || r.remindDays === '') ? 3 : Number(r.remindDays);
          const p = { pet: c.name, name: r.name, n: Math.abs(d) };
          if (d < 0) out.push({ key: 'r' + r.id, days: d, text: this.t('al_rx_over', p) });
          else if (d <= lim) out.push({ key: 'r' + r.id, days: d, text: this.t(d === 0 ? 'al_rx_today' : 'al_rx_soon', p) });
        }
      }
      return out.sort((a, b) => a.days - b.days);
    },

    // ---------- 寵物 ----------
    openPet(c) {
      this.cForm = c ? { ...c } : { id: null, name: '', species: 'cat', birth: '', gender: '', breed: '', chip: '', photo: '' };
      this.petModal = true;
    },
    savePet() {
      if (this.cForm.id) {
        const c = this.data.cats.find(x => x.id === this.cForm.id);
        Object.assign(c, { name: this.cForm.name, species: this.cForm.species, birth: this.cForm.birth, gender: this.cForm.gender, breed: this.cForm.breed, chip: this.cForm.chip, photo: this.cForm.photo });
      } else {
        const c = { ...this.cForm, id: uid(), meds: [], weights: [], vaccines: [], events: [], lifeLogs: [], vets: [], rx: [], reports: [], clinic: { name: '', vet: '', phone: '', address: '' } };
        this.data.cats.push(c); this.data.activeId = c.id; this.tab = 'home';
      }
      this.petModal = false;
      this.resetMed(); this.resetVaccine();
    },
    delPet() {
      const id = this.cForm.id;
      this.ask(this.t('c_delpet', { name: this.cForm.name }), () => {
        const c = this.data.cats.find(x => x.id === id);
        if (c) {
          const all = [].concat((c.lifeLogs || []).flatMap(x => x.files || []), (c.rx || []).flatMap(x => x.files || []), (c.reports || []).flatMap(x => x.files || []));
          this.removeFiles(all);
        }
        this.data.cats = this.data.cats.filter(x => x.id !== id);
        this.data.activeId = this.data.cats.length ? this.data.cats[0].id : null;
        this.petModal = false;
      });
    },
    pickPhoto(ev) {
      const f = ev.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = e => {
        const img = new Image();
        img.onload = () => {
          const S = 256, cv = document.createElement('canvas'); cv.width = cv.height = S;
          const ctx = cv.getContext('2d'), m = Math.min(img.width, img.height);
          ctx.drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, S, S);
          this.cForm.photo = cv.toDataURL('image/jpeg', 0.8);
        };
        img.src = e.target.result;
      };
      r.readAsDataURL(f);
    },
    loadDemo() {
      const t = this.today(), id = uid();
      this.data.cats.push({
        id, name: this.t('demo_name'), species: 'cat', birth: this.addDays(t, -900), gender: 'female_n', breed: this.lang === 'zh' ? '英國短毛貓' : 'British Shorthair', chip: '900123456789012', photo: '',
        meds: [
          { id: uid(), name: this.t('demo_med1'), type: 'flea', cycle: 30, last: this.addDays(t, -33) },
          { id: uid(), name: 'Bravecto', type: 'flea', cycle: 90, last: this.addDays(t, -85) },
          { id: uid(), name: this.t('demo_hw'), type: 'heartworm', cycle: 30, last: this.addDays(t, -10) },
        ],
        weights: [-120, -90, -60, -30, 0].map((o, i) => ({ id: uid(), date: this.addDays(t, o), kg: [3.9, 4.0, 4.1, 4.15, 4.2][i], note: '' })),
        vaccines: [{ id: uid(), name: this.t('demo_vax'), date: this.addDays(t, -360), next: this.addDays(t, 5) }],
        events: [{ id: uid(), date: this.addDays(t, -2), type: 'diarrhea', note: this.t('demo_ev') }],
        lifeLogs: [], vets: [], rx: [], reports: [],
        clinic: { name: this.t('demo_clinic'), vet: this.t('demo_vet'), phone: '0212345678', address: '' },
      });
      this.data.activeId = id;
    },

    // ---------- 驅蟲／預防藥 ----------
    nextDate(m) { return this.addDays(m.last, m.cycle); },
    statusOf(m) {
      const d = this.diffDays(this.nextDate(m));
      if (d < 0) return { key: 'red', label: this.t('st_over'), cls: 'bg-red-100 text-red-600', detail: this.t('d_over', { n: -d }) };
      if (d <= 7) return { key: 'yellow', label: this.t('st_soon'), cls: 'bg-yellow-100 text-yellow-700', detail: d === 0 ? this.t('d_today') : this.t('d_left', { n: d }) };
      return { key: 'green', label: this.t('st_ok'), cls: 'bg-green-100 text-green-700', detail: this.t('d_ok', { n: d }) };
    },
    vStatus(v) {
      const d = this.diffDays(v.next);
      if (d < 0) return { label: this.t('st_over'), cls: 'bg-red-100 text-red-600' };
      if (d <= 7) return { label: this.t('st_soon'), cls: 'bg-yellow-100 text-yellow-700' };
      return { label: this.t('st_ok'), cls: 'bg-green-100 text-green-700' };
    },
    resetMed() { this.mForm = { id: null, name: '', type: this.medTypesFor[0], cycle: '30', custom: '', last: this.today() }; },
    saveMed() {
      const cycle = this.mForm.cycle === 'custom' ? Number(this.mForm.custom) : Number(this.mForm.cycle);
      if (!cycle || cycle < 1) return this.say(this.t('t_cycle'));
      const item = { id: this.mForm.id || uid(), name: this.mForm.name.trim(), type: this.mForm.type, cycle, last: this.mForm.last };
      const i = this.pet.meds.findIndex(m => m.id === item.id);
      if (i >= 0) this.pet.meds[i] = item; else this.pet.meds.push(item);
      this.resetMed();
    },
    editMed(m) {
      const preset = ['30', '60', '90', '180', '365'].includes(String(m.cycle));
      this.mForm = { id: m.id, name: m.name, type: m.type, cycle: preset ? String(m.cycle) : 'custom', custom: preset ? '' : m.cycle, last: m.last };
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    markFed(m) { m.last = this.today(); },
    delMed(id) { this.ask(this.t('c_delmed'), () => { this.pet.meds = this.pet.meds.filter(m => m.id !== id); }); },

    // ---------- 用藥紀錄（處方／保健品） ----------
    hasDays(v) { return v !== '' && v !== null && v !== undefined && Number(v) > 0; },
    rxLast(r) { return r.days ? this.addDays(r.start, Number(r.days) - 1) : null; },
    rxStatus(r) {
      const last = this.rxLast(r);
      if (!last) return { label: this.t('rx_longterm'), cls: 'bg-orange-100 text-orange-600', detail: '', ended: false };
      const d = this.diffDays(last);
      if (d < 0) return { label: this.t('rx_ended_l'), cls: 'bg-orange-50 text-stone-500', detail: this.t('rx_endedn', { n: -d }), ended: true };
      if (d === 0) return { label: this.t('rx_lastday_l'), cls: 'bg-yellow-100 text-yellow-700', detail: this.t('rx_lastday'), ended: false };
      return { label: this.t('rx_going'), cls: 'bg-green-100 text-green-700', detail: this.t('rx_left', { n: d + 1 }), ended: false };
    },
    resetRx() {
      this.rxForm = { id: null, name: '', kind: 'rx', dose: '', freq: '', start: this.today(), days: '', reason: '', doctor: '', note: '', remind: false, remindDays: 3, ...emptyFiles() };
    },
    async saveRx() {
      const f = this.rxForm;
      const days = this.hasDays(f.days) ? Number(f.days) : null;
      if (f.days !== '' && f.days !== null && f.days !== undefined && days === null) return this.say(this.t('t_days'));
      const rd = (f.remindDays === '' || f.remindDays === null || f.remindDays === undefined) ? 3 : Number(f.remindDays);
      const item = {
        id: f.id || uid(), name: f.name.trim(), kind: f.kind, dose: f.dose, freq: f.freq, start: f.start, days,
        reason: f.reason, doctor: f.doctor, note: f.note,
        remind: !!f.remind && days !== null, remindDays: (isNaN(rd) || rd < 0) ? 3 : rd,
        files: this.plainFiles(f.files),
      };
      await this.commitForm(f);
      const i = this.pet.rx.findIndex(x => x.id === item.id);
      if (i >= 0) this.pet.rx[i] = item; else this.pet.rx.push(item);
      this.resetRx();
    },
    async editRx(r) {
      await this.discardForm(this.rxForm);
      this.rxForm = {
        id: r.id, name: r.name, kind: r.kind || 'rx', dose: r.dose || '', freq: r.freq || '', start: r.start,
        days: r.days ? r.days : '', reason: r.reason || '', doctor: r.doctor || '', note: r.note || '',
        remind: !!r.remind, remindDays: (r.remindDays === undefined || r.remindDays === null) ? 3 : r.remindDays,
        files: this.plainFiles(r.files), added: [], removed: [],
      };
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    async cancelRx() { await this.discardForm(this.rxForm); this.resetRx(); },
    delRx(id) {
      this.ask(this.t('c_delrx'), () => {
        const r = this.pet.rx.find(x => x.id === id);
        if (r) this.removeFiles(r.files);
        this.pet.rx = this.pet.rx.filter(x => x.id !== id);
      });
    },

    // ---------- 檢查報告 ----------
    resetReport() {
      this.rpForm = { id: null, type: 'blood', date: this.today(), clinic: '', summary: '', opinion: '', ...emptyFiles() };
    },
    async saveReport() {
      const f = this.rpForm;
      const item = { id: f.id || uid(), type: f.type, date: f.date, clinic: f.clinic, summary: f.summary, opinion: f.opinion, files: this.plainFiles(f.files) };
      await this.commitForm(f);
      const i = this.pet.reports.findIndex(x => x.id === item.id);
      if (i >= 0) this.pet.reports[i] = item; else this.pet.reports.push(item);
      this.resetReport();
    },
    async editReport(r) {
      await this.discardForm(this.rpForm);
      this.rpForm = { id: r.id, type: r.type, date: r.date, clinic: r.clinic || '', summary: r.summary || '', opinion: r.opinion || '', files: this.plainFiles(r.files), added: [], removed: [] };
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    async cancelReport() { await this.discardForm(this.rpForm); this.resetReport(); },
    delReport(id) {
      this.ask(this.t('c_delrp'), () => {
        const r = this.pet.reports.find(x => x.id === id);
        if (r) this.removeFiles(r.files);
        this.pet.reports = this.pet.reports.filter(x => x.id !== id);
      });
    },

    // ---------- 體重 ----------
    resetWeight() { this.wForm = { id: null, date: this.today(), kg: '', note: '' }; },
    saveWeight() {
      const val = Number(this.wForm.kg);
      if (!val || val <= 0) return this.say(this.t('t_wpos'));
      const item = { id: this.wForm.id || uid(), date: this.wForm.date, kg: this.toKg(val), note: this.wForm.note };
      const i = this.pet.weights.findIndex(w => w.id === item.id);
      if (i >= 0) this.pet.weights[i] = item; else this.pet.weights.push(item);
      this.resetWeight();
    },
    editWeight(w) { this.wForm = { id: w.id, date: w.date, kg: this.fromKg(w.kg), note: w.note }; window.scrollTo({ top: 0, behavior: 'smooth' }); },
    delWeight(id) { this.ask(this.t('c_delw'), () => { this.pet.weights = this.pet.weights.filter(w => w.id !== id); }); },

    drawChart() {
      if (this.tab !== 'weight' || !this.pet) return;
      if (typeof Chart === 'undefined') return;
      const cv = document.getElementById('weightChart'); if (!cv) return;
      const ws = [...this.pet.weights].sort((a, b) => a.date.localeCompare(b.date));
      const old = Chart.getChart(cv); if (old) old.destroy();
      weightChart = null;
      const unit = this.unit;
      weightChart = new Chart(cv, {
        type: 'line',
        data: {
          labels: ws.map(w => w.date.slice(5)),
          datasets: [{ label: this.t('weight') + ' (' + unit + ')', data: ws.map(w => this.fromKg(w.kg)), borderColor: '#f9a98f', backgroundColor: 'rgba(249,169,143,.2)', fill: true, tension: .35, pointBackgroundColor: '#fff', pointBorderColor: '#f26f4e', pointBorderWidth: 2, pointRadius: 5 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { callbacks: { title: i => ws[i[0].dataIndex].date } } }, scales: { y: { title: { display: true, text: unit } } } }
      });
    },

    // ---------- 疫苗 ----------
    resetVaccine() { this.vForm = { name: '', date: this.today(), next: '' }; },
    saveVaccine() { this.pet.vaccines.push({ id: uid(), ...this.vForm }); this.resetVaccine(); },
    delVaccine(id) { this.ask(this.t('c_delvax'), () => { this.pet.vaccines = this.pet.vaccines.filter(v => v.id !== id); }); },

    // ---------- 異常事件 ----------
    resetEvent() { this.eForm = { date: this.today(), type: this.eventTypes[0], note: '' }; },
    saveEvent() { this.pet.events.push({ id: uid(), ...this.eForm }); this.resetEvent(); },
    delEvent(id) { this.ask(this.t('c_delev'), () => { this.pet.events = this.pet.events.filter(e => e.id !== id); }); },
    eventIcon(t) { return { vomit: '🤮', diarrhea: '💩', appetite: '🍽️', lethargy: '😔', cough: '🤧' }[t] || '📌'; },

    // ---------- 生活紀錄 ----------
    resetLife() { this.lForm = { date: this.today(), type: this.lifeTypes[0], note: '', ...emptyFiles() }; },
    async saveLife() {
      const f = this.lForm;
      const item = { id: uid(), date: f.date, type: f.type, note: f.note, files: this.plainFiles(f.files) };
      await this.commitForm(f);
      this.pet.lifeLogs.push(item);
      this.resetLife();
    },
    delLife(id) {
      this.ask(this.t('c_dellife'), () => {
        const l = this.pet.lifeLogs.find(x => x.id === id);
        if (l) this.removeFiles(l.files);
        this.pet.lifeLogs = this.pet.lifeLogs.filter(x => x.id !== id);
      });
    },

    // ---------- 診所通訊錄 ----------
    resetVet() { this.vetForm = { name: '', doctor: '', phone: '', note: '' }; },
    saveVet() { this.pet.vets.push({ id: uid(), ...this.vetForm }); this.resetVet(); },
    delVet(id) { this.ask(this.t('c_delvet'), () => { this.pet.vets = this.pet.vets.filter(v => v.id !== id); }); },
  };
}
</script>

</body>
</html>
