<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>寵物健康記錄器 / Pet Health Tracker</title>

<!-- PWA Web App 設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pet Tracker">
<meta name="theme-color" content="#faf9f5">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Nunito:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;800&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>

<style>
  :root { --bg:#fff7f2; --fg:#5b4a42; --peach:#f9a98f; --cream:#fde8df; --mint:#bfe8c9; --font-display:"Huninn","Noto Sans TC",sans-serif; --font-body:"Noto Sans TC",system-ui,sans-serif; color-scheme: light; }
  html.en { --font-display:"Nunito","Noto Sans TC",sans-serif; --font-body:"Nunito","Noto Sans TC",system-ui,sans-serif; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); padding-inline:0; -webkit-tap-highlight-color: transparent; }
  h1,h2,h3,h4 { font-family: var(--font-display); }
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible { outline:3px solid var(--peach); outline-offset:2px; }
  [x-cloak] { display:none !important; }
  .card { background:#fff; border-radius:1.5rem; box-shadow:0 6px 20px rgba(240,160,140,.15); }
  .inp { width:100%; border:2px solid #fde2d8; background:#fffaf7; border-radius:1rem; padding:.6rem .9rem; outline:none; font-size:16px; }
  .inp:focus { border-color:#f9a98f; }
  .btn { border-radius:9999px; padding:.55rem 1.1rem; font-weight:700; transition:transform .1s; }
  .btn:active { transform:scale(.95); }
  .btn-main { background:#f9a98f; color:#fff; }
  .btn-soft { background:#fde8df; color:#c4725a; }
  .btn-green { background:#bfe8c9; color:#2f7a45; }
  .lbl { font-size:.8rem; color:#a08a80; margin-bottom:.2rem; display:block; }
  .tabbtn.active { color:#f26f4e; }
  .tabbtn.active .ico { background:#fde8df; }
</style>
</head>
<body>

<div class="min-h-screen pb-28" x-data="petApp()" x-cloak>

  <!-- 頂部標題 -->
  <header class="px-4 pt-5 pb-2 max-w-2xl mx-auto flex items-center justify-between gap-2">
    <h1 class="text-xl font-extrabold text-orange-400" x-text="'🐾 ' + t('app_title')"></h1>
    <div class="flex items-center gap-2">
      <button type="button" class="btn btn-soft !py-1.5 !px-3 text-sm" @click="setLang(lang==='zh' ? 'en' : 'zh')" x-text="lang==='zh' ? 'EN' : '中文'"></button>
      <template x-if="data.cats.length">
        <select class="inp !w-auto !py-1.5 !text-sm font-bold" x-model="data.activeId">
          <template x-for="c in data.cats" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
        </select>
      </template>
    </div>
  </header>
  <p class="px-4 max-w-2xl mx-auto text-xs" style="color:#a08a80" x-text="t('saved_note')"></p>

  <main class="px-4 max-w-2xl mx-auto space-y-4">

    <!-- 全域提醒橫幅 -->
    <template x-if="alerts.length">
      <div class="space-y-2">
        <template x-for="a in alerts" :key="a.key">
          <div class="rounded-2xl px-4 py-3 text-sm font-bold flex items-start gap-2 shadow-sm"
               :class="a.days<0 ? 'bg-red-100 text-red-700 border-2 border-red-200' : 'bg-yellow-100 text-yellow-800 border-2 border-yellow-200'">
            <span x-text="a.text"></span>
          </div>
        </template>
      </div>
    </template>

    <!-- 沒有寵物 -->
    <template x-if="!pet">
      <div class="card p-8 text-center space-y-4 mt-6">
        <div class="text-6xl">🐾</div>
        <p class="font-bold" x-text="t('no_pet')"></p>
        <div class="flex gap-2 justify-center flex-wrap">
          <button class="btn btn-main" @click="openPet()" x-text="t('add_pet')"></button>
          <button class="btn btn-soft" @click="loadDemo()" x-text="t('load_demo')"></button>
        </div>
      </div>
    </template>

    <template x-if="pet">
    <div class="space-y-4">

      <!-- ========== 1. 主頁 ========== -->
      <section x-show="tab==='home'" class="space-y-4">
        <div class="card p-5 text-center">
          <div class="w-28 h-28 rounded-full mx-auto bg-orange-100 border-4 border-orange-200 overflow-hidden flex items-center justify-center text-5xl">
            <template x-if="pet.photo"><img :src="pet.photo" class="w-full h-full object-cover"></template>
            <template x-if="!pet.photo"><span x-text="speciesIcon(pet.species)"></span></template>
          </div>
          <h2 class="mt-3 text-2xl font-extrabold" x-text="pet.name"></h2>
          <p class="text-sm text-orange-400 font-bold" x-text="age(pet.birth)"></p>
          <div class="grid grid-cols-2 gap-2 mt-4 text-left text-sm">
            <div class="bg-orange-50 rounded-2xl p-3"><span class="lbl" x-text="t('birth')"></span><b x-text="pet.birth || '—'"></b></div>
            <div class="bg-orange-50 rounded-2xl p-3"><span class="lbl" x-text="t('gender')"></span><b x-text="pet.gender ? lbl('g_', pet.gender) : '—'"></b></div>
            <div class="bg-orange-50 rounded-2xl p-3"><span class="lbl" x-text="t('species')"></span><b x-text="lbl('sp_', pet.species || 'cat')"></b></div>
            <div class="bg-orange-50 rounded-2xl p-3"><span class="lbl" x-text="t('breed')"></span><b x-text="pet.breed || '—'"></b></div>
            <div class="bg-orange-50 rounded-2xl p-3 col-span-2"><span class="lbl" x-text="t('chip')"></span><b class="break-all" x-text="pet.chip || '—'"></b></div>
          </div>
          <div class="flex gap-2 justify-center mt-4 flex-wrap">
            <button class="btn btn-soft" @click="openPet(pet)" x-text="'✏️ ' + t('edit')"></button>
            <button class="btn btn-main" @click="openPet()" x-text="t('add_pet')"></button>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="card p-4 text-center">
            <div class="text-2xl">⚖️</div><span class="lbl" x-text="t('latest_weight')"></span>
            <b class="text-lg" x-text="latestWeight ? fmtW(latestWeight.kg) : t('no_record')"></b>
            <div class="text-xs text-stone-400" x-text="latestWeight ? latestWeight.date : ''"></div>
          </div>
          <div class="card p-4 text-center">
            <div class="text-2xl">💊</div><span class="lbl" x-text="t('next_med')"></span>
            <b class="text-lg" x-text="nextMedSummary.date || t('no_record')"></b>
            <div class="text-xs text-stone-400" x-text="nextMedSummary.name"></div>
          </div>
          <div class="card p-4 text-center">
            <div class="text-2xl">💉</div><span class="lbl" x-text="t('next_vax')"></span>
            <b class="text-lg" x-text="nextVaccineSummary.date || t('no_record')"></b>
            <div class="text-xs text-stone-400" x-text="nextVaccineSummary.name"></div>
          </div>
        </div>
      </section>

      <!-- ========== 2. 體重 ========== -->
      <section x-show="tab==='weight'" class="space-y-4">
        <form class="card p-5 space-y-3" @submit.prevent="saveWeight()">
          <div class="flex items-center justify-between gap-2">
            <h3 class="font-extrabold text-lg" x-text="wForm.id ? '✏️ ' + t('w_edit') : '⚖️ ' + t('w_add')"></h3>
            <select class="inp !w-auto !py-1 !text-sm font-bold" x-model="unit" :aria-label="t('unit')">
              <option value="kg">kg</option><option value="lb">lb</option><option value="g">g</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="lbl" x-text="t('date')"></label><input type="date" class="inp" required x-model="wForm.date"></div>
            <div><label class="lbl" x-text="t('weight') + ' (' + unit + ')'"></label><input type="number" :step="unit==='g' ? '1' : '0.01'" min="0" class="inp" required x-model="wForm.kg" :placeholder="unit==='g' ? '4200' : (unit==='lb' ? '9.25' : '4.20')"></div>
          </div>
          <div><label class="lbl" x-text="t('note')"></label><input class="inp" x-model="wForm.note" :placeholder="t('ph_wnote')"></div>
          <div class="flex gap-2">
            <button class="btn btn-main flex-1" type="submit" x-text="wForm.id ? t('save_changes') : t('add')"></button>
            <button type="button" class="btn btn-soft" x-show="wForm.id" @click="resetWeight()" x-text="t('cancel')"></button>
          </div>
        </form>

        <div class="card p-4">
          <h3 class="font-extrabold mb-2" x-text="'📈 ' + t('trend')"></h3>
          <div class="relative h-60"><canvas id="weightChart"></canvas></div>
          <p class="text-center text-stone-400 text-sm mt-2" x-show="pet.weights.length<1" x-text="t('trend_empty')"></p>
        </div>

        <div class="card p-4">
          <h3 class="font-extrabold mb-2" x-text="'📋 ' + t('history')"></h3>
          <template x-for="w in [...pet.weights].sort((a,b)=>b.date.localeCompare(a.date))" :key="w.id">
            <div class="flex items-center justify-between py-2 border-b border-orange-50 last:border-0">
              <div>
                <b x-text="fmtW(w.kg)"></b>
                <span class="text-xs text-stone-400 ml-2" x-text="w.date"></span>
                <div class="text-xs text-stone-500" x-text="w.note"></div>
              </div>
              <div class="flex gap-1">
                <button class="btn btn-soft !px-3 !py-1 text-sm" @click="editWeight(w)" x-text="t('edit')"></button>
